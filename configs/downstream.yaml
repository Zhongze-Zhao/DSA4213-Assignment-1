data_config: configs/data.yaml
seed: 42
dataset: fancyzhx/ag_news       # 4-class news topic classification
train_size: 20000               # stratified subset of the 120k official train split
val_frac: 0.1                   # carved from the train subset, only used to pick C
max_len: 128                    # truncate inputs to the LMs' context length
models: [rnn, lstm, transformer, lstm_w2v, lstm_glove]   # all frozen
poolings: [last, mean, emb]
C_grid: [0.001, 0.003, 0.01, 0.03, 0.1, 1.0]
max_iter: 2000
compare_sst2: true              # report OOV of SST-2 too (dataset-choice justification)
